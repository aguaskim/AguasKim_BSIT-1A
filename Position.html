<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS position</title>

    <style>
        .header {
            position: fixed;
            top: 0;
            left: 0;
            height: 50px;
            background-color: #333;
            color: white;
            right: 0;
            z-index: 100;
        }

        .sidebar {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 75px;
            top: 50px;
            background-color: green;
            color: white;
        }

        .x {
            position: absolute;
            background-color: rgb(245, 27, 27);
            color: white;
            top: 0;
            right: 0;
            padding-left: 5px;
        }

        .abs {
            position: absolute;
            background-color: red;
            color: white;
            top: 60px;
            right: 10px;
        }

        .div1_container {
            height: 200px;
            width: 200px;
            background-color: lightblue;
            margin-top: 10px;
        }

        .div2_container {
            height: 200px;
            width: 200px;
            background-color: rgb(220, 165, 210);
            position: relative;
        }

        .five {
            background-color: black;
            color: azure;
            position: absolute;
            right: 10px;
            bottom: 10px;
        }

        body {
            height: 2000px;
            padding-top: 60px;
            padding-left: 80px;
        }
    </style>
</head>
<body>
    <div class="header">Header</div>
    <div class="sidebar">Sidebar
        <div class="x">x</div>
    </div>

    <!-- div and div -->

    <div class="div1_container">div1</div>
    <div class="div2_container">div2
        <div class="five">5:00</div>
    </div>
    <div class="abs">Absolute</div>
</body>
</html>
