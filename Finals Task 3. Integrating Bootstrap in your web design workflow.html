<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid Layouts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
<style>
    body {
        background-color: #f0f0f0;
        padding: 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    /* Layout 1 - Green  */
    .layout1-desktop {
        background-color: #e0e0e0;
        padding: 20px;
        margin-bottom: 30px;
    }

    .layout1-box-green {
        background-color: #2e8b57;
        color: white;
        padding: 20px;
        border: 2px solid white;
        font-weight: 500;
    }
    
    /* Layout 1 - Purple */
    .layout1-mobile {
        background-color: #e0e0e0;
        padding: 20px;
        margin-bottom: 30px;
    }
    .layout1-box-purple {
        background-color: #9400d3;
        color: white;
        padding: 20px;
        border: 2px solid #ffd700;
        font-weight: 500;
    }
    
    /* Layout 2 - Coral*/
    .layout2-desktop {
        background-color: #e0e0e0;
        padding: 20px;
        margin-bottom: 30px;
    }
    .layout2-box-coral {
        background-color: #fa8072;
        color: white;
        padding: 20px;
        border: 2px solid white;
        font-weight: 500;
    }
    
    /* Layout 2 - Teal*/
    .layout2-mobile {
        background-color: #e0e0e0;
        padding: 20px;
        margin-bottom: 30px;
    }
    .layout2-box-teal {
        background-color: #5f9ea0;
        color: white;
        padding: 20px;
        border: 2px solid white;
        font-weight: 500;
    }
    
    /* Layout 3 - Blue  */
    .layout3-desktop {
        background-color: #e0e0e0;
        padding: 20px;
        margin-bottom: 30px;
    }
    .layout3-box-blue {
        background-color: #4169e1;
        color: white;
        padding: 20px;
        border: 2px solid white;
        font-weight: 500;
    }
    
    /* Layout 3 - Dark Green */
    .layout3-mobile {
        background-color: #e0e0e0;
        padding: 20px;
        margin-bottom: 30px;
    }
    .layout3-box-dark {
        background-color: #2f4f4f;
        color: white;
        padding: 20px;
        border: 2px solid white;
        font-weight: 500;
    }

</style>

</head>
<body>

    <!-- LAYOUT 1: Green-->
    <h2 class="mb-3">Layout 1</h2>
    <div class="layout1-desktop">
        <div class="container-fluid">
            <div class="row">
                   <div class="col-12">
                    <div class="layout1-box-green">50% desktop, 100% mobile</div>
                </div>
                  <div class="col-12">
                    <div class="layout1-box-green">50% desktop, 100% mobile</div>
                </div>
            </div>
        </div>
    </div>

    <!-- LAYOUT 1: Purple-->
    <div class="layout1-mobile">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="layout1-box-purple">50% desktop, 100% mobile</div>
                </div>
                <div class="col-12">
                    <div class="layout1-box-purple">50% desktop, 100% mobile</div>
                </div>
            </div>
        </div>
    </div>

    <!-- LAYOUT 2: Coral -->
    <h2 class="mb-3">Layout 2</h2>
    <div class="layout2-desktop">
        <div class="container-fluid">
             <div class="row g-0">
                <div class="col-md-6">
                    <div class="layout2-box-coral">Column 1</div>
                </div>
                <div class="col-md-3">
                    <div class="layout2-box-coral">Column 2</div>
                </div>
                <div class="col-md-3">
                    <div class="layout2-box-coral">Column 3</div>
                </div>
            </div>
        </div>
    </div>

    <!-- LAYOUT 2: Teal-->
    <div class="layout2-mobile">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="layout2-box-teal">Column 1</div>
                </div>
                <div class="col-12">
                    <div class="layout2-box-teal">Column 2</div>
                </div>
                <div class="col-12">
                    <div class="layout2-box-teal">Column 3</div>
                </div>
            </div>
        </div>
    </div>

    <!-- LAYOUT 3: Blue  -->
    <h2 class="mb-3">Layout 3</h2>
    <div class="layout3-desktop">
        <div class="container-fluid">
            <div class="row g-0">
                <div class="col-md-4">
                    <div class="layout3-box-blue">Column 1</div>
                </div>
                <div class="col-md-8">
                    <div class="layout3-box-blue">Column 2</div>
                </div>
            </div>
        </div>
    </div>

    <!-- LAYOUT 3: Dark Green -->
    <div class="layout3-mobile">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="layout3-box-dark">Column 1</div>
                </div>
                <div class="col-12">
                    <div class="layout3-box-dark">Column 2</div>
                </div>
            </div>
        </div>
    </div>
